name: Deploy Pipeline

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [test]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set Environment Name
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          if [ "$TARGET_BRANCH" == "main" ]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
          else
            echo "ENV_NAME=$TARGET_BRANCH" >> $GITHUB_ENV
          fi

      - name: Deploy Application
        run: docker compose -f docker-compose/docker-compose.${{ env.ENV_NAME }}.yml up -d --build

      - name: Verifikacija okruženja
        run: |
          sleep 5
          echo "Provera iz fajla: docker-compose/docker-compose.${{ env.ENV_NAME }}.yml"
          docker compose -f docker-compose/docker-compose.${{ env.ENV_NAME }}.yml exec -T app env | grep APP_ENV
