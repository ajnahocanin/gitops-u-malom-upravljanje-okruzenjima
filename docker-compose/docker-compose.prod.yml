services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - APP_ENV=prod
      - APP_KOMENTAR=Nalazimo se u produkcionom okruzenju
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
