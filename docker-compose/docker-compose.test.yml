services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    environment:
      - APP_ENV=test
      - APP_KOMENTAR=Nalazimo se u test okruzenju
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
